# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

# Disabled for now due to changes in JavaForce

name: Java CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    if: false

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Javaforce
      uses: actions/checkout@v4
      with:
        repository: pquiring/javaforce
    - name: Checkout jfCraft
      uses: actions/checkout@v4
      with:
        path: games/jfcraft
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Build JavaForce with Ant
      run: ant -noinput -buildfile build.xml
    - name: Build JavaForce natives
      run: |
        cd native/linux
        . deps.sh
        ant -noinput -buildfile build.xml
    - name: Build JavaForce with Ant again
      run: ant -noinput -buildfile build.xml
    - name: Build jfCraft with Ant
      run: |
        cd games/jfcraft
        ant -noinput -buildfile build.xml
